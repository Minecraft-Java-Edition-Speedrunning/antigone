plugins {
    alias libs.plugins.fabric.loom
    id "maven-publish"
}

version = "$mod_version+$target_version"
group = maven_group

base {
    archivesName = archives_name
}

repositories {
    maven { url "https://jitpack.io" }
}

loom {
    decompilers {
        vineflower {
            options.putAll(["mark-corresponding-synthetics": "1", "indent-string": "    "])
        }
    }
    mixin {
        useLegacyMixinAp = false
    }
    runs {
        client {
            client()
            getJvmArguments().addAll(
                    "-Dorg.lwjgl.glfw.libname=/home/justin/download/libglfw-x86_64.so",
                    "-javaagent:/home/justin/.cache/gradle/caches/modules-2/files-2.1/net.fabricmc/sponge-mixin/0.17.5+mixin.0.8.7/cef8519a91129d0c21fa03bb9378f0e8ca810e5/sponge-mixin-0.17.5+mixin.0.8.7.jar"
            )
            getEnvironmentVars().put("__GL_THREADED_OPTIMIZATIONS", "0")
        }
    }
}

dependencies {
    minecraft libs.minecraft
    mappings variantOf(libs.yarn.mappings) { classifier "v2" }
    modImplementation libs.fabric.loader
}

processResources {
    def tokens = [
            version: project.version,
            minecraft_version: project.target_version
    ]
    inputs.properties tokens

    filesMatching("fabric.mod.json") {
        expand tokens
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release.set(8)
}

java {
    sourceCompatibility = targetCompatibility = JavaVersion.VERSION_1_8
    withSourcesJar()
}

jar {
    from "LICENSE"
}

publishing {
    publications.create("mavenJava", MavenPublication) {
        from components.java
    }
    repositories {}
}
